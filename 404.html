<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — deokma.web</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#cfe0f2" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site.css" />
<style>
  .nf{ min-height:100vh; display:grid; place-items:center; padding:20px; background:var(--wall); background-attachment:fixed; }
  .nf .win{ width:min(460px,100%); overflow:hidden; --rad:10px; }
  .nf .win::before{ display:none; }
  .nf .body{ padding:22px 22px 24px; }
  .nf .err{ font-family:var(--mono); font-size:12px; line-height:1.6; color:#cfe0f5; background:#0a1020;
    border:1px solid var(--win-bd); border-radius:7px; padding:12px 14px; margin:0 0 16px; }
  .nf .err b{ color:#ffb14d; }
  .nf h1{ font-family:var(--mono); font-size:22px; margin:0 0 8px; color:var(--ink); }
  .nf p{ font-size:14px; line-height:1.6; color:var(--ink-soft); margin:0 0 18px; }
</style>
</head>
<body>
<main class="nf">
  <div class="win glossy">
    <div class="winbar on">
      <span class="wb-title">error.log</span>
      <span class="wb-sp"></span>
      <span class="wb-btns" aria-hidden="true"><i>—</i><i>▢</i><i class="x">✕</i></span>
    </div>
    <div class="body">
      <pre class="err" aria-hidden="true"><b>404</b> file not found
C:\&gt; _</pre>
      <h1>Page not found</h1>
      <p>This page doesn't exist, or it moved when the site was rebuilt. Everything lives on the homepage now: projects, screenshots, release notes and links.</p>
      <a class="aqua" href="/">&gt;&gt; back to the homepage</a>
    </div>
  </div>
</main>
</body>
</html>
